name: Full NotebookLM Pipeline (100% Cloud Server - No PC Required)

on:
  workflow_dispatch:
    inputs:
      force_fresh:
        description: 'Force fresh run (ignore previous cache/artifacts)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "30 3 * * *" # 09:00 IST daily

permissions:
  contents: read
  actions: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get current date (UTC)
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies & virtual screen
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xvfb fonts-noto-core fonts-deva

      - name: Install Python dependencies & Playwright
        run: |
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Restore NotebookLM Session
        env:
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
        run: |
          python -c '
          import os, sys, json
          val = os.environ.get("NOTEBOOKLM_AUTH_JSON", "").strip()
          if not val:
              print("::error::NOTEBOOKLM_AUTH_JSON secret is missing or empty in GitHub Secrets!")
              print("To fix: Run \"python scripts/notebooklm_login.py\" locally, copy storage_state.json, and add it to GitHub Settings -> Secrets -> Actions as NOTEBOOKLM_AUTH_JSON.")
              sys.exit(1)
          try:
              data = json.loads(val)
              cookies = data if isinstance(data, list) else data.get("cookies", [])
              print(f"Session successfully validated: found {len(cookies)} cookies.")
              if len(cookies) == 0:
                  print("::warning::No cookies found in NOTEBOOKLM_AUTH_JSON secret. Session may fail.")
              with open("storage_state.json", "w", encoding="utf-8") as f:
                  f.write(val)
          except Exception as e:
              print(f"::error::NOTEBOOKLM_AUTH_JSON is not valid JSON: {e}")
              sys.exit(1)
          '

      - name: Restore previous pipeline cache (Resume on failure)
        if: ${{ !inputs.force_fresh }}
        uses: actions/cache/restore@v4
        id: cache-restore
        with:
          path: output
          key: pipeline-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pipeline-state-${{ github.run_id }}-
            pipeline-state-daily-${{ steps.date.outputs.date }}-
            pipeline-state-

      - name: Recover previous run video artifact (if cache missed)
        if: ${{ !inputs.force_fresh }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p output
          # If previous video was already successfully uploaded to YouTube, do not reuse it (allow fresh daily video)
          if [ -f output/upload_result.json ]; then
            echo "[RESUME] Previous video was already successfully uploaded to YouTube."
            echo "Starting fresh for new content."
            rm -rf output/*
          fi

          # If video is not yet on disk, search recent runs for unuploaded video artifact
          if [ ! -f output/notebooklm/notebooklm_video.mp4 ]; then
            echo "Searching for unuploaded video artifact in recent workflow runs..."
            RUN_IDS=$(gh run list --workflow="full-pipeline-cloud.yml" --limit 15 --json databaseId -q '.[].databaseId' 2>/dev/null || gh run list --limit 15 --json databaseId -q '.[].databaseId' 2>/dev/null || echo "")
            for rid in $RUN_IDS; do
              echo "Checking run $rid..."
              rm -rf /tmp/art_check
              mkdir -p /tmp/art_check
              if gh run download "$rid" --name full-notebooklm-pipeline-results --dir /tmp/art_check 2>/dev/null; then
                # Handle nested or flat extraction
                VID=$(find /tmp/art_check -name "notebooklm_video.mp4" 2>/dev/null | head -1)
                UP_RES=$(find /tmp/art_check -name "upload_result.json" 2>/dev/null | head -1)
                if [ -n "$UP_RES" ]; then
                  echo "Run $rid video was already uploaded to YouTube. Skipping."
                elif [ -n "$VID" ]; then
                  echo "=========================================================="
                  echo "[RESUME] Found unuploaded video in run $rid!"
                  echo "=========================================================="
                  # Copy all recovered files to output/
                  mkdir -p output/notebooklm
                  cp "$VID" output/notebooklm/notebooklm_video.mp4
                  META=$(find /tmp/art_check -name "metadata.json" 2>/dev/null | head -1)
                  BRIEF=$(find /tmp/art_check -name "*research_brief.md" 2>/dev/null | head -1)
                  THUMB=$(find /tmp/art_check -name "thumbnail.jpg" 2>/dev/null | head -1)
                  [ -n "$META" ] && cp "$META" output/metadata.json
                  [ -n "$BRIEF" ] && cp "$BRIEF" output/notebooklm_research_brief.md
                  [ -n "$THUMB" ] && cp "$THUMB" output/thumbnail.jpg
                  ls -lh output/notebooklm/notebooklm_video.mp4
                  break
                fi
              fi
            done
          fi

      - name: Generate research pack
        id: gen_pack
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -f output/metadata.json ] && [ -f output/notebooklm_research_brief.md ]; then
            echo "[RESUME] Metadata and research brief already present. Skipping pack generation."
          else
            python -m src.generate_pack --settings config/settings.json --output output
          fi

      - name: Prepare NotebookLM files
        run: |
          if [ ! -f output/notebooklm_research_brief.md ] || [ ! -f output/metadata.json ]; then
            d=$(ls -td output/research-* 2>/dev/null | head -1)
            if [ -n "$d" ]; then
              cp "$d/research_brief.md" output/notebooklm_research_brief.md
              cp "$d/notebooklm_prompt.txt" output/notebooklm_prompt.txt
              cp "$d/metadata.json" output/metadata.json
            fi
          fi
          if [ ! -f output/notebooklm_research_brief.md ] || [ ! -f output/metadata.json ]; then
            echo "::error::Research brief or metadata missing in output/"
            exit 1
          fi

      - name: Generate and download video from NotebookLM (Cloud)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -m src.notebooklm_api_automation \
              --sources output/notebooklm_research_brief.md \
              --prompt output/notebooklm_prompt.txt \
              --storage-state storage_state.json \
              --output output/notebooklm \
              --timeout-minutes 75

      - name: Create thumbnail when Devanagari font is configured
        run: |
          if [ -f output/thumbnail.jpg ]; then
            echo "[RESUME] Thumbnail already exists. Skipping."
          elif [ -f assets/fonts/NotoSansDevanagari-Bold.ttf ] && [ -f output/metadata.json ]; then
            thumb_text=$(python -c "import json; print(json.load(open('output/metadata.json')).get('thumbnail_text', ''))")
            if [ -n "$thumb_text" ]; then
              python -m src.thumbnail --text "$thumb_text" --output output/thumbnail.jpg --font assets/fonts/NotoSansDevanagari-Bold.ttf || true
            fi
          fi

      - name: Upload to YouTube privately
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ -f output/thumbnail.jpg ]; then
            python -m src.youtube_upload --video output/notebooklm/notebooklm_video.mp4 --metadata output/metadata.json --privacy private --thumbnail output/thumbnail.jpg --result output/upload_result.json
          else
            python -m src.youtube_upload --video output/notebooklm/notebooklm_video.mp4 --metadata output/metadata.json --privacy private --result output/upload_result.json
          fi

      - name: Save pipeline cache for resumption
        uses: actions/cache/save@v4
        if: always()
        with:
          path: output
          key: pipeline-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save Pipeline Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-notebooklm-pipeline-results
          path: output/
          if-no-files-found: warn
          retention-days: 14
