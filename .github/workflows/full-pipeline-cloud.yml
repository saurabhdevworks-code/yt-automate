name: Full NotebookLM Pipeline (100% Cloud Server - No PC Required)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution Mode: auto (full automated) or custom (manual controls)'
        required: true
        type: choice
        options:
          - auto
          - custom
        default: auto
      custom_topic:
        description: '[Custom] Topic / Subject for NotebookLM video (e.g. History of Internet in India)'
        required: false
        type: string
        default: ''
      custom_trim_start:
        description: '[Custom] Trim video from start (seconds or 00:00:05, leave blank for no trim)'
        required: false
        type: string
        default: ''
      custom_trim_end:
        description: '[Custom] Trim video end timestamp (e.g. 00:05:00, leave blank for no trim)'
        required: false
        type: string
        default: ''
      custom_intro_url:
        description: '[Custom] Intro video link (Google Drive / Direct MP4 URL, optional)'
        required: false
        type: string
        default: ''
      custom_thumbnail_url:
        description: '[Custom] Thumbnail link (Google Drive / Direct image URL, optional)'
        required: false
        type: string
        default: ''
      custom_yt_title:
        description: '[Custom] YouTube Title (optional - auto-generated if blank)'
        required: false
        type: string
        default: ''
      custom_yt_description:
        description: '[Custom] YouTube Description (optional - auto-generated if blank)'
        required: false
        type: string
        default: ''
      custom_yt_tags:
        description: '[Custom] YouTube Tags comma-separated (optional - e.g. AI, Hindi, Tech)'
        required: false
        type: string
        default: ''
      upload_privacy:
        description: 'YouTube Upload Privacy (private, unlisted, public)'
        required: true
        type: choice
        options:
          - private
          - unlisted
          - public
        default: private
      force_fresh:
        description: 'Force fresh run (ignore previous cache/artifacts)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "30 3 * * *" # 09:00 IST daily

permissions:
  contents: read
  actions: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get current date (UTC)
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies & ffmpeg
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xvfb fonts-noto-core fonts-deva ffmpeg

      - name: Install Python dependencies & Playwright
        run: |
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Restore NotebookLM Session
        env:
          NOTEBOOKLM_MASTER_TOKEN_JSON: ${{ secrets.NOTEBOOKLM_MASTER_TOKEN_JSON }}
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
        run: |
          python -c '
          import os, sys, json
          from pathlib import Path

          master_val = os.environ.get("NOTEBOOKLM_MASTER_TOKEN_JSON", "").strip()
          auth_val = os.environ.get("NOTEBOOKLM_AUTH_JSON", "").strip()

          if master_val:
              print("Found NOTEBOOKLM_MASTER_TOKEN_JSON! Setting up permanent Master Token auth...")
              try:
                  data = json.loads(master_val)
                  Path("master_token.json").write_text(master_val, encoding="utf-8")
                  prof_dir = Path.home() / ".notebooklm" / "profiles" / "default"
                  prof_dir.mkdir(parents=True, exist_ok=True)
                  (prof_dir / "master_token.json").write_text(master_val, encoding="utf-8")
                  acct = data.get("email", "configured user")
                  print(f"Master Token configured successfully for: {acct}")
              except Exception as e:
                  print(f"::error::NOTEBOOKLM_MASTER_TOKEN_JSON is not valid JSON: {e}")
                  sys.exit(1)
          elif auth_val:
              print("Found legacy NOTEBOOKLM_AUTH_JSON cookies. (Note: These expire; recommend upgrading to NOTEBOOKLM_MASTER_TOKEN_JSON).")
              try:
                  data = json.loads(auth_val)
                  cookies = data if isinstance(data, list) else data.get("cookies", [])
                  print(f"Session successfully validated: found {len(cookies)} cookies.")
                  if len(cookies) == 0:
                      print("::warning::No cookies found in NOTEBOOKLM_AUTH_JSON secret. Session may fail.")
                  with open("storage_state.json", "w", encoding="utf-8") as f:
                      f.write(auth_val)
              except Exception as e:
                  print(f"::error::NOTEBOOKLM_AUTH_JSON is not valid JSON: {e}")
                  sys.exit(1)
          else:
              print("::error::Neither NOTEBOOKLM_MASTER_TOKEN_JSON nor NOTEBOOKLM_AUTH_JSON secret was found!")
              print("To fix permanently so auth NEVER expires: Run \"python scripts/setup_master_token.py\" locally and add NOTEBOOKLM_MASTER_TOKEN_JSON to GitHub Secrets.")
              sys.exit(1)
          '
          if [ -f master_token.json ]; then
            echo "Pre-minting fresh session cookies from durable master token..."
            notebooklm --storage storage_state.json auth refresh || true
          fi

      - name: Restore previous pipeline cache (Resume on failure)
        if: ${{ !inputs.force_fresh }}
        uses: actions/cache/restore@v4
        id: cache-restore
        with:
          path: output
          key: pipeline-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pipeline-state-${{ github.run_id }}-
            pipeline-state-daily-${{ steps.date.outputs.date }}-
            pipeline-state-

      - name: Recover previous run video artifact (if cache missed)
        if: ${{ !inputs.force_fresh }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p output
          if [ -f output/upload_result.json ]; then
            echo "[RESUME] Previous video was already successfully uploaded to YouTube."
            echo "Starting fresh for new content."
            rm -rf output/*
          fi

          if [ ! -f output/notebooklm/notebooklm_video.mp4 ]; then
            echo "Searching for unuploaded video artifact in recent workflow runs..."
            RUN_IDS=$(gh run list --repo "$GH_REPO" --limit 15 --json databaseId -q '.[].databaseId' 2>/dev/null || echo "")
            for rid in $RUN_IDS; do
              echo "Checking run $rid..."
              rm -rf /tmp/art_check
              mkdir -p /tmp/art_check
              if gh run download "$rid" --repo "$GH_REPO" --name full-notebooklm-pipeline-results --dir /tmp/art_check 2>/dev/null; then
                VID=$(find /tmp/art_check -name "notebooklm_video.mp4" 2>/dev/null | head -1)
                UP_RES=$(find /tmp/art_check -name "upload_result.json" 2>/dev/null | head -1)
                if [ -n "$UP_RES" ]; then
                  echo "Run $rid video was already uploaded to YouTube. Skipping."
                elif [ -n "$VID" ]; then
                  echo "=========================================================="
                  echo "[RESUME] Found unuploaded video in run $rid!"
                  echo "=========================================================="
                  mkdir -p output/notebooklm
                  cp "$VID" output/notebooklm/notebooklm_video.mp4
                  META=$(find /tmp/art_check -name "metadata.json" 2>/dev/null | head -1)
                  BRIEF=$(find /tmp/art_check -name "*research_brief.md" 2>/dev/null | head -1)
                  THUMB=$(find /tmp/art_check -name "thumbnail.jpg" 2>/dev/null | head -1)
                  [ -n "$META" ] && cp "$META" output/metadata.json
                  [ -n "$BRIEF" ] && cp "$BRIEF" output/notebooklm_research_brief.md
                  [ -n "$THUMB" ] && cp "$THUMB" output/thumbnail.jpg
                  ls -lh output/notebooklm/notebooklm_video.mp4
                  break
                fi
              fi
            done
          fi

      - name: Generate research pack
        id: gen_pack
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODE: ${{ inputs.mode || 'auto' }}
          CUSTOM_TOPIC: ${{ inputs.custom_topic }}
          CUSTOM_TITLE: ${{ inputs.custom_yt_title }}
          CUSTOM_DESC: ${{ inputs.custom_yt_description }}
          CUSTOM_TAGS: ${{ inputs.custom_yt_tags }}
        run: |
          if [ -f output/metadata.json ] && [ -f output/notebooklm_research_brief.md ]; then
            echo "[RESUME] Metadata and research brief already present. Skipping pack generation."
          else
            python -m src.generate_pack \
              --settings config/settings.json \
              --output output \
              --custom-topic "$CUSTOM_TOPIC" \
              --custom-title "$CUSTOM_TITLE" \
              --custom-description "$CUSTOM_DESC" \
              --custom-tags "$CUSTOM_TAGS"
          fi

      - name: Prepare NotebookLM files
        run: |
          if [ ! -f output/notebooklm_research_brief.md ] || [ ! -f output/metadata.json ]; then
            d=$(ls -td output/research-* 2>/dev/null | head -1)
            if [ -n "$d" ]; then
              cp "$d/research_brief.md" output/notebooklm_research_brief.md
              cp "$d/notebooklm_prompt.txt" output/notebooklm_prompt.txt
              cp "$d/metadata.json" output/metadata.json
            fi
          fi
          if [ ! -f output/notebooklm_research_brief.md ] || [ ! -f output/metadata.json ]; then
            echo "::error::Research brief or metadata missing in output/"
            exit 1
          fi

      - name: Generate and download video from NotebookLM (Cloud)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -m src.notebooklm_api_automation \
              --sources output/notebooklm_research_brief.md \
              --prompt output/notebooklm_prompt.txt \
              --storage-state storage_state.json \
              --output output/notebooklm \
              --timeout-minutes 75

      - name: Process Video (Trim, Intro, Thumbnail & Custom Metadata)
        env:
          INTRO_URL: ${{ inputs.custom_intro_url }}
          TRIM_START: ${{ inputs.custom_trim_start }}
          TRIM_END: ${{ inputs.custom_trim_end }}
          CUSTOM_THUMB: ${{ inputs.custom_thumbnail_url }}
          CUSTOM_TITLE: ${{ inputs.custom_yt_title }}
          CUSTOM_DESC: ${{ inputs.custom_yt_description }}
          CUSTOM_TAGS: ${{ inputs.custom_yt_tags }}
        run: |
          python -m src.video_processor \
            --video output/notebooklm/notebooklm_video.mp4 \
            --intro-url "$INTRO_URL" \
            --trim-start "$TRIM_START" \
            --trim-end "$TRIM_END" \
            --custom-thumbnail-url "$CUSTOM_THUMB" \
            --thumbnail-out output/thumbnail.jpg \
            --metadata output/metadata.json \
            --custom-title "$CUSTOM_TITLE" \
            --custom-description "$CUSTOM_DESC" \
            --custom-tags "$CUSTOM_TAGS"

      - name: Create thumbnail when Devanagari font is configured
        run: |
          if [ -f output/thumbnail.jpg ]; then
            echo "[RESUME] Thumbnail already present (custom or generated). Skipping auto-creation."
          elif [ -f assets/fonts/NotoSansDevanagari-Bold.ttf ] && [ -f output/metadata.json ]; then
            thumb_text=$(python -c "import json; print(json.load(open('output/metadata.json')).get('thumbnail_text', ''))")
            if [ -n "$thumb_text" ]; then
              python -m src.thumbnail --text "$thumb_text" --output output/thumbnail.jpg --font assets/fonts/NotoSansDevanagari-Bold.ttf || true
            fi
          fi

      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          ALLOW_PUBLIC_PUBLISH: "true"
          PRIVACY: ${{ inputs.upload_privacy || 'private' }}
        run: |
          if [ -f output/thumbnail.jpg ]; then
            python -m src.youtube_upload --video output/notebooklm/notebooklm_video.mp4 --metadata output/metadata.json --privacy "$PRIVACY" --thumbnail output/thumbnail.jpg --result output/upload_result.json
          else
            python -m src.youtube_upload --video output/notebooklm/notebooklm_video.mp4 --metadata output/metadata.json --privacy "$PRIVACY" --result output/upload_result.json
          fi

      - name: Save pipeline cache for resumption
        uses: actions/cache/save@v4
        if: always()
        with:
          path: output
          key: pipeline-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save Pipeline Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-notebooklm-pipeline-results
          path: output/
          if-no-files-found: warn
          retention-days: 14
