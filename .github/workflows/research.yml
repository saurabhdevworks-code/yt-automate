name: Research & NotebookLM Pack

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *" # 09:00 IST daily

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Research and prepare NotebookLM handoff
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: python -m src.generate_pack --settings config/settings.json --output output
      - uses: actions/upload-artifact@v4
        with:
          name: notebooklm-research-pack
          path: output/research-*/
          if-no-files-found: error
          retention-days: 14
