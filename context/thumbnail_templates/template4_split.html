<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800;900&family=Poppins:wght@700;800;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1280px; height: 720px; overflow: hidden;
    font-family: 'Baloo 2', 'Poppins', sans-serif;
    position: relative; background: #0b1320;
  }
  .bg-image {
    position: absolute; top: 0; right: 0; width: 100%; height: 100%;
    background-image: url('{bg_url}');
    background-size: cover;
    background-position: {bg_pos};
  }
  .split-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(105deg, 
      rgba(15, 23, 42, 0.97) 0%, 
      rgba(15, 23, 42, 0.94) 48%, 
      rgba(15, 23, 42, 0.3) 75%, 
      transparent 100%);
  }
  .content {
    position: relative; z-index: 10; height: 100%;
    padding: 44px 52px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .top-bar { display: flex; align-items: center; gap: 16px; }
  .channel-pill {
    background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px);
    border: 2px solid #334155; color: #f8fafc; padding: 8px 22px;
    border-radius: 12px; font-size: 20px; font-family: 'Poppins', sans-serif;
    font-weight: 800; display: flex; align-items: center; gap: 8px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.6);
  }
  .alert-pill {
    background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
    border: 2px solid #fca5a5; color: #ffffff; padding: 8px 22px;
    border-radius: 12px; font-size: 22px; font-weight: 800;
    box-shadow: 0 4px 20px rgba(239, 68, 68, 0.6);
  }
  .headline-group { max-width: 700px; margin-top: -10px; }
  .title-line-1 {
    font-size: 78px; font-weight: 900; color: #ffffff; line-height: 1.1;
    text-shadow: 0 4px 14px rgba(0,0,0,0.95); margin-bottom: 8px;
  }
  .highlight-banner {
    display: inline-block;
    background: linear-gradient(135deg, #fde047 0%, #eab308 100%);
    color: #0f172a; font-size: 78px; font-weight: 900; line-height: 1.1;
    padding: 8px 28px; border-radius: 18px; border: 4px solid #ffffff;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8); margin: 8px 0 16px 0;
  }
  .comparison-box {
    display: flex; gap: 14px; margin-top: 6px;
  }
  .comp-tag {
    background: rgba(30, 41, 59, 0.9); border: 2px solid #64748b;
    color: #f1f5f9; padding: 8px 20px; border-radius: 12px;
    font-size: 26px; font-weight: 800;
  }
  .comp-tag.active {
    background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
    border-color: #86efac; color: #ffffff; box-shadow: 0 4px 15px rgba(22, 163, 74, 0.5);
  }
  .bottom-badge {
    display: inline-flex; align-items: center; gap: 18px;
    background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px);
    border: 2px solid #eab308; padding: 12px 26px; border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.7); max-width: 520px;
  }
  .badge-stat { font-size: 52px; font-weight: 900; color: #fde047; line-height: 1; }
  .badge-text { font-size: 26px; font-weight: 800; color: #ffffff; line-height: 1.2; }
  .badge-tag { font-size: 17px; font-weight: 700; color: #4ade80; display: block; margin-top: 2px; }
</style>
</head>
<body>
  <div class="bg-image"></div>
  <div class="split-overlay"></div>
  <div class="content">
    <div class="top-bar">
      <div class="channel-pill">{channel}</div>
      <div class="alert-pill">{top_badge}</div>
    </div>
    <div class="headline-group">
      <div class="title-line-1">{line1}</div>
      <div class="highlight-banner">{highlight}</div>
      <div class="comparison-box">
        <div class="comp-tag">❌ पुराना घाटा</div>
        <div class="comp-tag active">✔ {benefit}</div>
      </div>
    </div>
    <div class="bottom-badge">
      <div class="badge-stat">{stat_num}</div>
      <div class="badge-text">
        {stat_title}
        <span class="badge-tag">{stat_tag}</span>
      </div>
    </div>
  </div>
</body>
</html>
